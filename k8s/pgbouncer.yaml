apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  namespace: scalable-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgbouncer
  template:
    metadata:
      labels:
        app: pgbouncer
    spec:
      containers:
        - name: pgbouncer
          image: edoburu/pgbouncer:latest
          ports:
            - containerPort: 6432
          env:
            - name: DATABASE_URL
              value: "postgresql://postgres:postgres@event-store-db:5432/event_store_db"
            - name: LISTEN_PORT
              value: "6432"
            - name: POOL_MODE
              value: "transaction"
            - name: MAX_CLIENT_CONN
              value: "1000"
            - name: DEFAULT_POOL_SIZE
              value: "20"
            - name: AUTH_TYPE
              value: "trust"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: pgbouncer
  namespace: scalable-demo
spec:
  selector:
    app: pgbouncer
  ports:
    - port: 6432
