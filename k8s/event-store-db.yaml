apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: event-store-db
  namespace: scalable-demo
spec:
  serviceName: event-store-db
  replicas: 1
  selector:
    matchLabels:
      app: event-store-db
  template:
    metadata:
      labels:
        app: event-store-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: scalable-demo-secrets
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: scalable-demo-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: "event_store_db"
            # Local/demo only: Postgres 16 defaults to scram-sha-256, which
            # pgbouncer's password handling doesn't line up with out of the
            # box, causing "wrong password type". trust skips password
            # verification entirely for this dev setup.
            - name: POSTGRES_HOST_AUTH_METHOD
              value: "trust"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: event-store-db
  namespace: scalable-demo
spec:
  clusterIP: None
  selector:
    app: event-store-db
  ports:
    - port: 5432
