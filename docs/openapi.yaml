openapi: 3.0.3
info:
  title: Ledgerline API
  version: 1.0.0
  description: |
    Every endpoint as called through `api-gateway` (Kong) — the only entry
    point for clients. Routing lives in `infrastructure/api-gateway/kong.yml`.

    **Auth.** Sign up or log in to get a short-lived access token (15 min),
    then send it as `Authorization: Bearer <token>`. The refresh token
    (30 days) is only ever sent as an httpOnly `refreshToken` cookie. The
    token is checked at the gateway and again in each service, and the user
    is always taken from it — a `userId` in a body or query is ignored
    ([ADR 0013](https://github.com/joshichaitanya/ledgerline/blob/main/docs/adr/0013-user-id-from-verified-token.md)).

    **Writes are asynchronous.** `POST`/`PUT`/`DELETE /transactions` only
    record the change in the event store and answer `202 Accepted`. It
    reaches `GET /transactions` a moment later, after CDC → Kafka →
    `db-writer-service`. A change that can never apply (bad data, or a
    transaction owned by another user) is still accepted here and ends up in
    the dead letter queue instead
    ([ADR 0014](https://github.com/joshichaitanya/ledgerline/blob/main/docs/adr/0014-transaction-ownership-in-db-writer.md)).

    **Rate limit.** Per client IP, on every route: 1000/min in
    docker-compose, 100/min in k8s. Over the limit → `429`.

    **Errors.** The services answer `{ "error": "..." }`; the gateway itself
    (missing/invalid token, rate limit) answers `{ "message": "..." }`.
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8000
    description: api-gateway, local docker-compose

tags:
  - name: Auth
    description: auth-service — accounts and tokens
  - name: Transactions
    description: create/update/delete-transaction-service (writes), get-transactions-service (reads)
  - name: Categories
    description: categories-service — shared defaults plus each user's own

security:
  - bearerAuth: []

paths:
  /signup:
    post:
      operationId: signUp
      tags: [Auth]
      summary: Create an account
      description: Creates the user, returns an access token and sets the refresh-token cookie.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name: { type: string, example: Jane Doe }
                email: { type: string, format: email, example: jane@example.com }
                password: { type: string, format: password, example: password123 }
      responses:
        '201':
          description: Account created
          headers:
            Set-Cookie: { $ref: '#/components/headers/RefreshTokenCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '409':
          description: Email already registered
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /login:
    post:
      operationId: logIn
      tags: [Auth]
      summary: Log in
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email, example: jane@example.com }
                password: { type: string, format: password, example: password123 }
      responses:
        '200':
          description: Logged in
          headers:
            Set-Cookie: { $ref: '#/components/headers/RefreshTokenCookie' }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Wrong email or password
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /refresh:
    post:
      operationId: refreshToken
      tags: [Auth]
      summary: Get a new access token
      description: |
        Reads the refresh token from the `refreshToken` cookie and **rotates**
        it: the old one stops working and a new one is set. Browsers must
        call this with `credentials: 'include'`.
      security:
        - refreshCookie: []
      responses:
        '200':
          description: New access token
          headers:
            Set-Cookie: { $ref: '#/components/headers/RefreshTokenCookie' }
          content:
            application/json:
              schema:
                type: object
                required: [accessToken]
                properties:
                  accessToken: { type: string }
        '401':
          description: Cookie missing, invalid, expired, or already used/revoked (the cookie is cleared)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /logout:
    post:
      operationId: logOut
      tags: [Auth]
      summary: Log out this session
      description: Revokes the refresh token in the cookie (if any) and clears the cookie. The access token still works until it expires (at most 15 min).
      security:
        - bearerAuth: []
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /change-password:
    put:
      operationId: changePassword
      tags: [Auth]
      summary: Change password
      description: Also revokes **every** refresh token for the user (logs out everywhere) and clears the cookie.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password }
      responses:
        '204': { description: Password changed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: Missing/invalid access token, or `currentPassword` is wrong
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /transactions:
    get:
      operationId: listTransactions
      tags: [Transactions]
      summary: List my transactions
      description: The logged-in user's transactions, newest first. Deleted ones are left out.
      responses:
        '200':
          description: The user's transactions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Transaction' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: createTransactions
      tags: [Transactions]
      summary: Create transactions
      description: |
        Takes an **array**, so several can be sent at once. The client
        chooses each `transactionId` (a UUID), which makes a retry safe
        ([ADR 0001](https://github.com/joshichaitanya/ledgerline/blob/main/docs/adr/0001-client-generated-transaction-id.md)).
        Asynchronous — see the note at the top.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items: { $ref: '#/components/schemas/NewTransaction' }
      responses:
        '202': { description: Recorded in the event store }
        '400':
          description: Body is not an array of transaction objects
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /transactions/{transactionId}:
    parameters:
      - $ref: '#/components/parameters/TransactionId'
    put:
      operationId: updateTransaction
      tags: [Transactions]
      summary: Update a transaction
      description: |
        Send the whole transaction. The id in the URL wins over any
        `transactionId` in the body. Asynchronous — see the note at the top.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionFields' }
      responses:
        '202': { description: Recorded in the event store }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
    delete:
      operationId: deleteTransaction
      tags: [Transactions]
      summary: Delete a transaction
      description: Records a delete (tombstone). Asynchronous — see the note at the top.
      responses:
        '202': { description: Recorded in the event store }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /transactions/summary:
    get:
      operationId: getSpendSummary
      tags: [Transactions]
      summary: Monthly spend totals
      description: |
        Totals per subcategory for each UTC month: one month if `month` is
        given, otherwise all 12 months of `year`. Served from Redis when
        cached, otherwise computed and cached for up to 1 hour
        ([ADR 0011](https://github.com/joshichaitanya/ledgerline/blob/main/docs/adr/0011-spend-summary-cache-aside.md)).
      parameters:
        - name: year
          in: query
          required: true
          schema: { type: integer, example: 2026 }
        - name: month
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 12, example: 10 }
      responses:
        '200':
          description: One entry per month asked for
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MonthSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /categories:
    get:
      operationId: listCategories
      tags: [Categories]
      summary: List categories
      description: The 12 shared defaults plus the user's own, each with the subcategories the user can see. Oldest first, so defaults come first.
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Category' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }
    post:
      operationId: createCategory
      tags: [Categories]
      summary: Add a category
      description: Adds a category only this user sees.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NameInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Category' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: A category with this name (any case) is already visible to this user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

  /categories/{categoryId}/subcategories:
    post:
      operationId: createSubcategory
      tags: [Categories]
      summary: Add a subcategory
      description: Adds a subcategory, only this user sees, under a default category or one of the user's own.
      parameters:
        - name: categoryId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NameInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Subcategory' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404':
          description: Category not found — or another user's (same answer, so it isn't revealed)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: A subcategory with this name (any case) already exists in this category
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }
        '500': { $ref: '#/components/responses/ServerError' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: The access token from `/signup`, `/login` or `/refresh`.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refreshToken

  headers:
    RefreshTokenCookie:
      description: '`refreshToken=<token>; HttpOnly; Secure; SameSite=None; Path=/; Max-Age=2592000`'
      schema: { type: string }

  parameters:
    TransactionId:
      name: transactionId
      in: path
      required: true
      schema: { type: string, format: uuid }

  schemas:
    User:
      type: object
      required: [id, name, email]
      properties:
        id: { type: integer, example: 42, description: The one user id used everywhere (ADR 0012) }
        name: { type: string, example: Jane Doe }
        email: { type: string, format: email, example: jane@example.com }

    AuthResponse:
      type: object
      required: [user, accessToken]
      properties:
        user: { $ref: '#/components/schemas/User' }
        accessToken: { type: string, description: 'JWT, valid 15 minutes. Claims: `userId`, `jti`, `iss` (`scalable-demo`), `iat`, `exp`.' }

    TransactionFields:
      type: object
      required: [subCategoryId, amount, description, transactionDate]
      properties:
        subCategoryId: { type: string, description: An id from `GET /categories`, example: 3f2c8a6e-1b7d-4c55-9a0e-2d4f6b8c1a90 }
        amount: { type: number, example: 42.5 }
        description: { type: string, example: Weekly shop }
        transactionDate: { type: string, format: date-time, example: '2026-10-28T09:30:00.000Z' }

    NewTransaction:
      allOf:
        - type: object
          required: [transactionId]
          properties:
            transactionId: { type: string, format: uuid, description: Chosen by the client }
        - $ref: '#/components/schemas/TransactionFields'

    Transaction:
      allOf:
        - type: object
          required: [transactionId, userId]
          properties:
            transactionId: { type: string, format: uuid }
            userId: { type: integer, example: 42 }
        - $ref: '#/components/schemas/TransactionFields'

    MonthSummary:
      type: object
      required: [month, bySubcategory]
      properties:
        month: { type: string, pattern: '^\d{4}-\d{2}$', example: '2026-10', description: UTC month }
        bySubcategory:
          type: object
          description: Total spent per subcategory id. Months with no spending are `{}`.
          additionalProperties: { type: number }
          example: { 3f2c8a6e-1b7d-4c55-9a0e-2d4f6b8c1a90: 120.75 }

    Subcategory:
      type: object
      required: [id, name, custom]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Painting }
        custom: { type: boolean, description: '`true` if the user added it, `false` for a shared default' }

    Category:
      type: object
      required: [id, name, custom, subcategories]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: Hobbies }
        custom: { type: boolean, description: '`true` if the user added it, `false` for a shared default' }
        subcategories:
          type: array
          items: { $ref: '#/components/schemas/Subcategory' }

    NameInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 100, description: Trimmed before checking, example: Hobbies }

    Error:
      type: object
      description: '`error` from a service, `message` from the gateway.'
      properties:
        error: { type: string }
        message: { type: string }

  responses:
    BadRequest:
      description: Missing or invalid input
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing, invalid or expired access token
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many requests from this IP (from the gateway)
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServerError:
      description: Unexpected server error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
