apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: spend-summary-cache
  namespace: scalable-demo
spec:
  serviceName: spend-summary-cache
  replicas: 1
  selector:
    matchLabels:
      app: spend-summary-cache
  template:
    metadata:
      labels:
        app: spend-summary-cache
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: spend-summary-cache
  namespace: scalable-demo
spec:
  clusterIP: None
  selector:
    app: spend-summary-cache
  ports:
    - port: 6379
