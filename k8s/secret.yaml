# Plain-text values for local-cluster demo only — a real deployment would
# use `kubectl create secret` / sealed-secrets / a vault, not a checked-in
# stringData block.
apiVersion: v1
kind: Secret
metadata:
  name: scalable-demo-secrets
  namespace: scalable-demo
type: Opaque
stringData:
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  EVENT_STORE_DATABASE_URL: "postgresql://postgres:postgres@pgbouncer:6432/event_store_db"
  # Straight to event-store-db, bypassing pgbouncer - only for migrations
  # (create-transaction-service's init container): pgbouncer's transaction
  # pooling breaks node-pg-migrate's session-level lock.
  EVENT_STORE_DIRECT_DATABASE_URL: "postgresql://postgres:postgres@event-store-db:5432/event_store_db"
  TRANSACTIONS_DATABASE_URL: "postgresql://postgres:postgres@transactions-db:5432/transactions_db"
  REFERENCE_DATABASE_URL: "postgresql://postgres:postgres@reference-db:5432/reference_db"
  # auth-service's own DB - credentials only (id/email/password_hash), kept
  # separate from reference-db's general-purpose users table.
  AUTH_DATABASE_URL: "postgresql://postgres:postgres@auth-db:5432/auth_db"
  # Shared between auth-service (signs) and every service that verifies
  # tokens via the toolkit middleware (see services/toolkit/README.md).
  # Placeholder value — replace before this goes anywhere real.
  JWT_SECRET: "local-dev-only-change-me"
